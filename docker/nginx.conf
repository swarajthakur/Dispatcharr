# Channel/VOD logos and SD program posters share /data/cache/ with separate zones.
proxy_cache_path /data/cache/logos levels=1:2 keys_zone=logo_cache:10m
                 inactive=24h use_temp_path=off;

proxy_cache_path /data/cache/sd_posters levels=1:2 keys_zone=sd_poster_cache:10m
                 inactive=14d use_temp_path=off;

server {
    listen NGINX_PORT;
    listen [::]:NGINX_PORT;

    proxy_connect_timeout 75;
    proxy_send_timeout 300;
    proxy_read_timeout 300;
    client_max_body_size 0;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host:$server_port;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # Serve Django via uWSGI
    location / {
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
    }

    location /assets/ {
        root /app/static;
    }

    location /static/ {
        root /app;
    }

    location /logos/ {
        root /data;
    }

    # Internal location for X-Accel-Redirect backup downloads
    # Django handles auth, nginx serves the file directly
    location /protected-backups/ {
        internal;
        alias /data/backups/;
    }

    location ~ ^/api/channels/logos/(?<logo_id>\d+)/cache/ {
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$request_uri";  # Cache per logo URL
        proxy_cache_valid 200 24h;  # Cache successful logos for 24 hours
        proxy_cache_valid 404 1m;   # Short negative cache; avoids stampeding Django/upstream
        proxy_cache_use_stale error timeout updating;  # Serve stale if Django is slow
    }

    location ~ ^/api/vod/vodlogos/(?<logo_id>\d+)/cache/ {
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$request_uri";  # Cache per logo URL
        proxy_cache_valid 200 24h;  # Cache successful logos for 24 hours
        proxy_cache_valid 404 1m;   # Short negative cache; avoids stampeding Django/upstream
        proxy_cache_use_stale error timeout updating;  # Serve stale if Django is slow
    }

    # Parent-scoped VOD images (backdrops, episode stills, etc.)
    location ~ ^/api/vod/(movies|series|episodes)/(?<vod_id>\d+)/image/ {
        proxy_pass http://127.0.0.1:5656;
        proxy_cache logo_cache;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 24h;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
    }

    # SD program posters: 14d nginx cache. Clients pass ?v=<hash of sd_icon>
    # Do not add proxy_cache_valid 404 here. Bare HTTP 404s from SD/CDN are treated
    # as transient in the poster proxy (only code 5000 blacklists); a negative cache
    # would delay legitimate retries. Permanent misses are handled in Django/DB.
    location ~ ^/api/epg/programs/(?<prog_id>\d+)/poster/ {
        proxy_pass http://127.0.0.1:5656;
        proxy_cache sd_poster_cache;
        proxy_cache_key "$scheme$request_uri";
        proxy_cache_valid 200 14d;
        proxy_cache_use_stale error timeout updating;
    }

    # Admin UI disabled outside dedicated admin access. Match /admin and all
    # deeper Django admin paths (e.g. /admin/login/), but do not match the
    # three-segment XC stream form /admin/<password>/<channel_id> used when
    # the XC username is literally "admin".
    location ~ ^/admin(?!/[^/]+/[^/]+/?$)(?:/|$) {
        return 301 /login;
    }

    # Route HDHR request to Django
    location /hdhr {
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
    }

    # WebSockets for real-time communication
    location /ws/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }

    # Route TS proxy requests to the dedicated instance
    location /proxy/ {
        include uwsgi_params;
        uwsgi_pass unix:/app/uwsgi.sock;
        uwsgi_buffering off;
        uwsgi_read_timeout 300s;
        uwsgi_send_timeout 300s;
        client_max_body_size 0;
    }

    # --- VPN passthrough for Redirect-mode streaming (opt-in) ---
    # A live-stream Redirect can be rewritten via an M3U account profile
    # (search/replace) to point back at this path:
    #     /vpnstream/<scheme>/<host>/<rest-of-path>
    # so the player fetches the stream back through THIS nginx, whose egress
    # rides the pod's VPN sidecar. The upstream is taken entirely from the
    # request, so no provider host is hardcoded here.
    #
    # Inert by default: nothing hits this unless a profile redirects here.
    # Plain redirects (no rewrite) still go straight to the provider (no VPN).
    #
    # A variable proxy_pass resolves at request time, so a resolver is required;
    # NGINX_RESOLVER is substituted at startup with the pod's own nameserver
    # (see docker/init/03-init-dispatcharr.sh), and cached via valid=.
    # The provider 302s live URLs to a token'd edge node. Follow that redirect
    # INSIDE nginx (proxy_redirect is unreliable with a variable proxy_pass) so
    # the client gets one continuous 200 and every hop egresses via the pod VPN.
    recursive_error_pages on;

    location ~ ^/vpnstream/(?<up_scheme>https?)/(?<up_host>[^/]+)/(?<up_uri>.*)$ {
        resolver NGINX_RESOLVER ipv6=off valid=300s;
        proxy_pass $up_scheme://$up_host/$up_uri$is_args$args;
        proxy_set_header Host $up_host;   # present the upstream host, not this one
        proxy_buffering off;              # no startup buffer gate -> fast zap
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @vpnfollow;
    }

    # Re-proxy to the upstream's redirect target (still tunneled). Also handles a
    # chained redirect (edge -> edge) via recursive_error_pages.
    location @vpnfollow {
        resolver NGINX_RESOLVER ipv6=off valid=300s;
        proxy_pass $upstream_http_location;   # Location header from the upstream 3xx
        proxy_buffering off;
        proxy_http_version 1.1;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @vpnfollow;
    }
}
